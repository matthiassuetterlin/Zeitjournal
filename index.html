<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitjournal</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Gewähltes Design vor dem ersten Zeichnen setzen, damit nichts aufblitzt
    try { const t = localStorage.getItem('zeitjournal.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Zeitjournal</h1>
    <nav class="daynav">
      <button id="prevDay" title="Vorheriger Tag (←)">‹</button>
      <button id="today" title="Heute (T)">Heute</button>
      <button id="nextDay" title="Nächster Tag (→)">›</button>
      <span id="dateLabel" class="date-label"></span>
    </nav>
    <div class="clock">
      <span id="runningInfo" class="running-info"></span>
      <button id="startStop" class="startstop" title="Start/Stopp (Leertaste)">▶ Start</button>
      <button id="themeToggle" class="theme-toggle" title="Hell/Dunkel umschalten"></button>
    </div>
  </header>

  <section class="palette" id="palette" aria-label="Kategorien"></section>

  <main>
    <section class="day">
      <div class="day-tools">
        <span class="label">Zoom</span>
        <button id="zoomOut" title="Herauszoomen (Strg + Mausrad)">−</button>
        <button id="zoomFit" title="Ganzen Tag auf einmal zeigen">Ganzer Tag</button>
        <button id="zoomIn" title="Hineinzoomen, damit kurze Blöcke breiter werden (Strg + Mausrad)">+</button>
      </div>
      <div class="track-scroll" id="trackScroll">
        <div class="track-inner" id="trackInner">
          <div class="scale" id="scale"></div>
          <div class="track" id="track" title="Ziehen, um einen Block anzulegen"></div>
        </div>
      </div>
      <div class="resize-y" id="trackResize" role="separator" aria-orientation="horizontal" aria-label="Höhe der Zeitleiste ändern" tabindex="0" title="Ziehen = Zeitleiste höher/niedriger · Doppelklick = zurücksetzen"></div>
      <p class="hint">Auf der leeren Leiste ziehen = neuer Block · Block ziehen = verschieben · Ränder ziehen = länger/kürzer · Doppelklick = umbenennen · Entf = löschen · + / Strg+Mausrad = hineinzoomen · Griff unter der Leiste = höher</p>
    </section>

    <div class="overview">
      <section class="month">
        <div class="month-head">
          <button id="prevMonth" title="Vorheriger Monat">‹</button>
          <h2 id="monthLabel"></h2>
          <button id="nextMonth" title="Nächster Monat">›</button>
        </div>
        <div class="month-grid" id="monthGrid"></div>
        <p class="month-total" id="monthTotal"></p>
      </section>

      <div class="resize-x" id="monthResize" role="separator" aria-orientation="vertical" aria-label="Breite der Monatsübersicht ändern" tabindex="0" title="Ziehen = Monat breiter/schmaler · Doppelklick = zurücksetzen"></div>

      <section class="week">
        <h2>Woche <span id="weekLabel"></span></h2>
        <div id="weekRows"></div>
      </section>
    </div>

    <section class="summary">
      <h2>Summen</h2>
      <div class="summary-grid">
        <div><h3>Heute</h3><div id="sumDay"></div></div>
        <div><h3>Diese Woche</h3><div id="sumWeek"></div></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <label>Raster
      <select id="snap">
        <option value="5">5 min</option>
        <option value="15" selected>15 min</option>
        <option value="30">30 min</option>
      </select>
    </label>
    <button id="copyYesterday" title="Blöcke vom letzten erfassten Tag übernehmen">Vortag übernehmen</button>
    <button id="exportCsv">CSV exportieren</button>
    <button id="exportJson">Sicherung speichern</button>
    <label class="filebtn">Sicherung laden<input type="file" id="importJson" accept="application/json"></label>
  </footer>

  <div id="editor" class="editor" hidden>
    <input id="editorInput" type="text" placeholder="Bezeichnung (optional)">
  </div>

  <div id="confirmDialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmText">
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button id="confirmCancel">Abbrechen</button>
        <button id="confirmOk" class="primary">OK</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
