name: Windows-Desktop-Version

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'index.html', 'app.js', 'style.css', 'desktop.js', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'index.html', 'app.js', 'style.css', 'desktop.js', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Zeitjournal-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
      # Auf main: Installer als Release veröffentlichen, damit er unter „Releases“ zum Herunterladen bereitliegt
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Zeitjournal für Windows (${{ github.run_number }})
          body: Installer herunterladen, doppelklicken, fertig. Windows warnt beim ersten Start, weil der Installer nicht signiert ist; dann auf „Weitere Informationen“ und „Trotzdem ausführen“ klicken.
          files: desktop/dist/*.exe
          make_latest: true
